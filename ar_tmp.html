<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="LHOUSSAINE BOURBI — S.S GUIGOU — BOULMANE 2026">
<title>دعم اللغة العربية</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0f766e; --primary-hover: #115e59; --primary-light: #ccfbf1; --primary-dark: #134e4a;
    --accent: #f59e0b; --accent-light: #fef3c7;
    --success: #16a34a; --success-light: #dcfce7;
    --danger: #dc2626; --danger-light: #fee2e2;
    --bg: #f6f7f4; --card: #ffffff; --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
    --radius: 16px; --radius-sm: 10px;
    --shadow: 0 4px 10px -2px rgb(0 0 0 / .06);
  }
  body {
    font-family: 'Tajawal', 'Cairo', 'Segoe UI', 'Noto Naskh Arabic', Tahoma, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; min-height: 100vh;
    display: flex; flex-direction: column; font-size: 17px;
  }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40; }
  .header-container { max-width: 1150px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), #0ea5e9); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; }
  .brand-title { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { background: var(--primary-light); color: var(--primary-dark); font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid #99f6e4; }
  .badge-amber { background: var(--accent-light); color: #92400e; border-color: #fde68a; }
  .header-sub { font-size: .74rem; color: var(--muted); }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  main { flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding: 22px 14px; }
  footer { background: #fff; border-top: 1px solid var(--border); padding: 12px 16px; text-align: center; font-size: .78rem; color: var(--muted); }
  footer .credit { direction: ltr; font-weight: 800; color: var(--primary-dark); letter-spacing: .5px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(to left, var(--primary), #0ea5e9, var(--accent)); }
  .narrow { max-width: 600px; margin: 0 auto; }
  .mid { max-width: 760px; margin: 0 auto; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; font-size: .95rem; font-weight: 700; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: all .15s; font-family: inherit; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { filter: brightness(1.05); }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: #f1f5f9; }
  .btn-soft { background: var(--primary-light); border-color: #99f6e4; color: var(--primary-dark); }
  .btn-soft:hover { background: #99f6e4; }
  .btn-sm { padding: 6px 12px; font-size: .8rem; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn { padding: 7px 10px; border-radius: var(--radius-sm); background: #fff; border: 1px solid var(--border); cursor: pointer; font-size: 1rem; }

  .screen { display: none; animation: fadeIn .25s ease-out; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: .88rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
  .form-input, .form-select { width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #f8fafc; font-size: 1rem; font-family: inherit; color: var(--text); outline: none; }
  .form-input:focus, .form-select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 4px 14px; font-size: .8rem; font-weight: 700; border-radius: 999px; background: #fff; border: 1px solid var(--border); cursor: pointer; }
  .chip.active, .chip:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
  .level-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .level-card { border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 14px; cursor: pointer; text-align: center; background: #fff; transition: all .15s; }
  .level-card .big { font-size: 2rem; font-weight: 900; color: var(--primary); line-height: 1.2; }
  .level-card.active { border-color: var(--primary); background: var(--primary-light); }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-top: 16px; }
  .game-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all .2s; display: flex; flex-direction: column; justify-content: space-between; }
  .game-card:hover { border-color: #5eead4; transform: translateY(-2px); box-shadow: 0 10px 15px -5px rgb(0 0 0 / .08); }
  .game-card.done { background: #f0fdf4; border-color: #86efac; }
  .gc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .gc-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
  .gc-title { font-size: 1rem; font-weight: 800; }
  .gc-desc { font-size: .82rem; color: var(--muted); margin-bottom: 10px; flex: 1; }
  .gc-foot { display: flex; justify-content: space-between; border-top: 1px solid #f1f5f9; padding-top: 8px; font-size: .78rem; font-weight: 700; color: var(--primary); }

  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f8fafc; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; border: 1px solid var(--border); font-size: .85rem; font-weight: 700; flex-wrap: wrap; }
  .progress { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; background: linear-gradient(to left, var(--primary), #0ea5e9); transition: width .3s; }
  .q-box { background: #fff; border: 1px solid #cbd5e1; border-radius: var(--radius-sm); padding: 16px; font-size: 1.1rem; font-weight: 800; text-align: center; margin-bottom: 16px; line-height: 1.8; }
  .q-big { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; }
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ans-btn { background: #fff; border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; font-size: 1rem; font-weight: 700; text-align: right; cursor: pointer; font-family: inherit; color: var(--text); transition: all .15s; }
  .ans-btn.center { text-align: center; font-size: 1.6rem; }
  .ans-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0fdfa; }
  .ans-btn.correct { background: var(--success-light) !important; border-color: var(--success) !important; color: #14532d !important; }
  .ans-btn.wrong { background: var(--danger-light) !important; border-color: var(--danger) !important; color: #7f1d1d !important; }
  .feedback { padding: 13px 15px; border-radius: var(--radius-sm); margin: 14px 0; font-size: .92rem; font-weight: 600; }
  .feedback.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
  .feedback.ko { background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; }
  .feedback ul { margin: 6px 22px 0 0; }
  .row-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

  .num-in { width: 150px; padding: 8px; font-size: 1.8rem; font-weight: 800; text-align: center; direction: ltr; border: 2px solid #94a3b8; border-radius: 10px; font-family: inherit; outline: none; background: #fff; }
  .num-in:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
  .num-in.sm { width: 90px; font-size: 1.3rem; }
  .answer-line { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }

  /* Reminder / modelling */
  .rem-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .rem-tag { background: var(--accent-light); color: #92400e; border: 1px solid #fde68a; font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .rem-list { list-style: none; display: grid; gap: 8px; margin-bottom: 14px; }
  .rem-list li { background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: .93rem; }
  .rem-list li::before { content: "💡 "; }
  .model-box { background: #fffbeb; border: 2px dashed #fcd34d; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .model-box h4 { font-size: .95rem; font-weight: 800; color: #92400e; margin-bottom: 8px; }
  .steps { margin: 4px 22px 0 0; font-size: .92rem; }
  .steps li { margin-bottom: 4px; }

  /* Representations */
  .pieces { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; justify-content: center; min-height: 80px; background: #fffbeb; border: 2px dashed #fcd34d; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .builder { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .builder .unit { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px; text-align: center; font-size: .85rem; font-weight: 700; }
  .builder .unit .ctrls { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .wheel-wrap { display: flex; justify-content: center; margin-bottom: 12px; }

  /* Place value table */
  table.pv { border-collapse: collapse; margin: 0 auto 14px; direction: ltr; }
  table.pv th { background: var(--primary); color: #fff; padding: 8px 14px; font-size: .9rem; border: 1px solid #0d5e57; }
  table.pv td { border: 1px solid var(--border); padding: 8px; text-align: center; background: #fff; }
  table.pv td input { width: 54px; height: 54px; font-size: 1.6rem; font-weight: 800; text-align: center; border: 2px solid #94a3b8; border-radius: 8px; font-family: inherit; }
  table.pv td.show { font-size: 1.6rem; font-weight: 900; }

  /* Column operations */
  .col-op { display: grid; direction: ltr; gap: 4px; justify-content: center; margin: 0 auto 14px; background: #fff; padding: 14px 18px; border: 1px solid var(--border); border-radius: 12px; width: max-content; }
  .cell { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 800; }
  .cell.carry input { width: 28px; height: 28px; font-size: .9rem; color: #b45309; border: 1px dashed #f59e0b; border-radius: 6px; text-align: center; font-weight: 800; background: #fffbeb; }
  .cell.res input { width: 44px; height: 48px; font-size: 1.6rem; font-weight: 800; text-align: center; border: 2px solid #94a3b8; border-radius: 8px; font-family: inherit; }
  .cell.res input:focus { border-color: var(--primary); outline: none; }
  .op-line { grid-column: 1 / -1; height: 3px; background: var(--text); border-radius: 2px; margin: 2px 0; }
  .col-head { font-size: .7rem; color: var(--muted); font-weight: 700; height: 18px; }

  /* Ordering */
  .seq-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .seq-item { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 1.4rem; font-weight: 800; }
  .seq-btn { padding: 4px 10px; background: #f1f5f9; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: .9rem; margin-inline-start: 4px; }

  /* Problems */
  .problem-text { background: #f0fdfa; border-right: 5px solid var(--primary); padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; line-height: 2; }
  .fourq { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .fourq span { padding: 4px 10px; border-radius: 999px; font-size: .75rem; font-weight: 800; background: #f1f5f9; color: var(--muted); border: 1px solid var(--border); }
  .fourq span.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .fourq span.ok { background: var(--success-light); color: #14532d; border-color: #86efac; }

  /* Timer */
  .timer { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .timer > div { height: 100%; background: var(--accent); width: 100%; }

  .stars { font-size: 2.6rem; letter-spacing: 4px; margin: 6px 0 10px; animation: pop .4s ease-out; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
  .stat .k { font-size: .75rem; color: var(--muted); }
  .stat .v { font-size: 1.15rem; font-weight: 800; }

  /* Drawer */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 100; display: none; }
  .drawer { position: fixed; top: 0; bottom: 0; right: 0; width: 100%; max-width: 540px; background: #fff; z-index: 101; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s ease-out; box-shadow: -4px 0 25px -5px rgba(0,0,0,.2); }
  .drawer.open { transform: none; }
  .drawer-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .drawer-content { flex: 1; overflow-y: auto; padding: 18px; font-size: .92rem; }
  .drawer-content h4 { color: var(--primary-dark); font-weight: 800; margin: 16px 0 6px; }
  .drawer-content ul, .drawer-content ol { margin-right: 20px; margin-bottom: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }

  /* Table */
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  table.res { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.res th, table.res td { padding: 8px 9px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  table.res th { background: #f8fafc; font-weight: 800; color: #334155; }
  .pct { display: inline-block; min-width: 40px; text-align: center; padding: 1px 6px; border-radius: 6px; font-weight: 800; }
  .pct.hi { background: #dcfce7; color: #166534; } .pct.mid { background: #fef9c3; color: #854d0e; } .pct.lo { background: #fee2e2; color: #991b1b; } .pct.na { color: #cbd5e1; }
  .bars { display: grid; gap: 6px; margin-top: 10px; }
  .bar-row { display: grid; grid-template-columns: 170px 1fr 48px; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; }
  .bar-track { height: 12px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; }

  @media (max-width: 560px) {
    .level-pick { grid-template-columns: 1fr; }
    .cell { width: 38px; height: 40px; font-size: 1.45rem; }
    .cell.res input { width: 36px; height: 42px; font-size: 1.35rem; }
    .bar-row { grid-template-columns: 110px 1fr 40px; }
    .header-sub { display: none; }
  }
  @media print {
    header, footer, .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 2px solid #000; }
  }

  .hint { font-size: .75rem; color: var(--muted); margin: -2px 0 8px; }
  .level-pick.lv5 { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .level-pick.lv5 .level-card { padding: 10px 4px; }
  .level-pick.lv3 { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .level-pick.lv3 .level-card { padding: 10px 6px; }
  .path-hint { font-size: .7rem; color: var(--muted); margin-top: 4px; min-height: 1em; line-height: 1.4; }
  .brick-sec { margin-top: 18px; }
  .brick-head { display: flex; align-items: center; gap: 10px; border-inline-start: 5px solid var(--primary); background: #fff; border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow); }
  .brick-sec .games-grid { margin-top: 10px; }
  .goal-block { margin-bottom: 10px; }
  .goal-head { font-weight: 800; margin-bottom: 6px; color: var(--primary-dark); }
  .passage { background: #fffdf5; border: 1px solid #fde68a; border-radius: 12px; padding: 14px 16px; font-size: 1.12rem; line-height: 2.1; margin-bottom: 14px; }
  .passage .p-title { font-weight: 900; text-align: center; color: #92400e; margin-bottom: 6px; }
  .passage .ln { display: block; }
  .passage .ln b.no { display: inline-block; min-width: 26px; color: #b45309; font-size: .8rem; }
  .q-box .speak { margin-inline-start: 10px; vertical-align: middle; }
  .q-big { font-size: 2.4rem; font-weight: 900; line-height: 1.5; }
  .q-pic { font-size: 3.6rem; line-height: 1.2; }
  .flash-box { background: #eef2ff; border: 2px dashed #a5b4fc; border-radius: 14px; padding: 16px; text-align: center; margin-bottom: 14px; }
  .flash-word { font-size: 2.3rem; font-weight: 900; margin-bottom: 10px; }
  .flash-hidden { font-size: 1rem; font-weight: 800; color: #4338ca; padding: 18px 0; }
  .flash-box .timer > div { background: #6366f1; }
  .answers.big .ans-btn { font-size: 1.6rem; text-align: center; }
  .answers.center .ans-btn { text-align: center; }
  .order-slot { min-height: 64px; border: 2px dashed #94a3b8; border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; background: #f8fafc; margin-bottom: 12px; }
  .order-slot.tight { gap: 3px; }
  .order-slot.ok { border-color: var(--success); background: var(--success-light); }
  .order-slot.ko { border-color: var(--danger); background: var(--danger-light); }
  .order-slot.vertical, .order-pool.vertical { flex-direction: column; align-items: stretch; }
  .slot-ph { color: var(--muted); font-size: .85rem; }
  .order-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tile { background: #fff; border: 2px solid #cbd5e1; border-radius: 10px; padding: 8px 14px; font-size: 1.35rem; font-weight: 800; cursor: pointer; font-family: inherit; color: var(--text); box-shadow: 0 2px 0 #cbd5e1; }
  .order-pool.vertical .tile, .order-slot.vertical .tile { font-size: 1rem; text-align: start; line-height: 1.8; }
  .tile:hover:not(:disabled) { border-color: var(--primary); }
  .tile.placed { background: var(--primary-light); border-color: #5eead4; }
  .right-order { font-weight: 800; font-size: 1.1rem; margin-top: 4px; }
  .letter-chip { display: inline-block; min-width: 44px; padding: 2px 10px; margin: 2px; border-radius: 10px; background: var(--primary-light); color: var(--primary-dark); font-weight: 900; font-size: 1.3rem; text-align: center; }
  @media (max-width: 560px) {
    .level-pick.lv5 { grid-template-columns: repeat(5, 1fr); }
    .level-pick.lv5 .level-card .big { font-size: 1.5rem; }
    .level-pick.lv5 .level-card div:last-child { font-size: .62rem !important; }
    .level-pick.lv3 { grid-template-columns: repeat(3, 1fr); }
    .passage { font-size: 1.02rem; }
    .flash-word { font-size: 1.9rem; }
  }
  .word-chip { display: inline-block; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 4px 12px; margin: 3px; font-size: 1.35rem; font-weight: 800; }
  .gap { display: inline-block; min-width: 1.4em; border-bottom: 3px solid var(--accent); color: var(--accent); text-align: center; }
  mark { background: #fde68a; border-radius: 4px; padding: 0 2px; }
  [dir=ltr] .ans-btn { text-align: left; }
  [dir=ltr] table.res th, [dir=ltr] table.res td { text-align: left; }
  [dir=ltr] .drawer { right: auto; left: 0; transform: translateX(-100%); }
  [dir=ltr] .drawer.open { transform: none; }
  [dir=ltr] .drawer-content ul, [dir=ltr] .drawer-content ol { margin-right: 0; margin-left: 20px; }
  [dir=ltr] .feedback ul, [dir=ltr] .steps { margin: 6px 0 0 22px; }
  [dir=ltr] body { font-family: 'Segoe UI', 'Trebuchet MS', Tahoma, Arial, sans-serif; }

</style>
</head>
<body>
<script>
/* =====================================================================
   تطبيق دعم اللغة العربية — برنامج دعم التعلمات الأساس (مدارس الريادة)
   المحتوى مأخوذ من حصص «حصص التعلمات الأساس — اللغة العربية» (المستويات 2 إلى 6)
   ===================================================================== */

function letterPool(lv) { return LETTERS; }
const N = 8;
function textQuestions(pool, lv, key, n) {
  const texts = pickFresh(key, byLevel(pool, lv).map(x => x.title), 3).map(t => pool.find(x => x.title === t));
  const out = [];
  texts.forEach(tx => shuffle(tx.qs).slice(0, 3).forEach(q => out.push({ tx, q })));
  return out.slice(0, n).map(({ tx, q }) => {
    const o = makeOptions(q.ok, q.bad, 3);
    return { kind: 'mcq', passageTitle: `«${tx.title}»`, passage: tx.text, q: q.q, options: o.options, answer: o.answer, speak: tx.text, explain: `الْجَوابُ مِنَ النَّصِّ: <strong>${q.ok}</strong>` };
  });
}
const sentencesOf = text => text.replace(/([.؟!»])\s+/g, '$1\n').split('\n').map(s => s.trim()).filter(Boolean);

  $('ui-msg').textContent = msg; inp.style.display = input ? 'block' : 'none'; inp.value = '';
  $('ui-cancel').style.display = cancel ? 'inline-flex' : 'none'; m.style.display = 'flex';
  const close = () => { m.style.display = 'none'; };
  $('ui-ok').onclick = () => { close(); if (onOk) onOk(inp.value); };
  $('ui-cancel').onclick = close;
  setTimeout(() => (input ? inp : $('ui-ok')).focus(), 30);
  inp.onkeydown = e => { if (e.key === 'Enter') $('ui-ok').click(); };
}
const uiAlert = msg => uiDialog(msg);
const uiConfirm = (msg, onYes) => uiDialog(msg, { cancel: true }, onYes);
const uiPrompt = (msg, onOk) => uiDialog(msg, { cancel: true, input: true }, onOk);

/* ---------- optional voice (never required to answer) ---------- */
const TTS = {
  voice: null, ready: false,
  init() {
    if (!('speechSynthesis' in window)) return;
    const choose = () => { const vs = speechSynthesis.getVoices(); this.voice = vs.find(v => v.lang && v.lang.toLowerCase().startsWith(A.ttsLang)) || null; this.ready = !!this.voice; };
    choose(); speechSynthesis.onvoiceschanged = choose;
  },
  say(text) {
    if (!this.ready || sound.muted) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = this.voice; u.lang = this.voice.lang; u.rate = .8; speechSynthesis.speak(u); } catch (e) {}
  }
};

/* ---------- exercise bank memory (avoid repeats on this device) ---------- */
const RECENT_KEY = A.store + '_recent';
function recentGet(k) { try { return (JSON.parse(localStorage.getItem(RECENT_KEY) || '{}')[k]) || []; } catch (e) { return []; } }
function recentAdd(k, ids, keep) { try { const all = JSON.parse(localStorage.getItem(RECENT_KEY) || '{}'); all[k] = [...ids, ...(all[k] || [])].slice(0, keep); localStorage.setItem(RECENT_KEY, JSON.stringify(all)); } catch (e) {} }
/* n elements of pool, those not seen recently first */
function pickFresh(key, pool, n, idOf = x => (typeof x === 'string' ? x : JSON.stringify(x))) {
  const rec = new Set(recentGet(key));
  const fresh = shuffle(pool.filter(p => !rec.has(idOf(p)))), old = shuffle(pool.filter(p => rec.has(idOf(p))));
  const out = [...fresh, ...old].slice(0, n);
  recentAdd(key, out.map(idOf), Math.max(n, Math.floor(pool.length * 0.7)));
  return out;
}
/* n options: the answer + distinct distractors, shuffled; returns {options, answer} */
function makeOptions(correct, distractors, n = 4) {
  const ds = shuffle(uniq(distractors.filter(d => d !== correct))).slice(0, n - 1);
  const options = shuffle([correct, ...ds]);
  return { options, answer: options.indexOf(correct) };
}
/* fill up to n items by cycling a generator */
function fillItems(n, gen) { const out = []; for (let i = 0; out.length < n && i < n * 6; i++) { const it = gen(i); if (it) out.push(it); } return out; }

const bricksOf = (lv, p) => (A.PATHS[lv] && A.PATHS[lv][p]) || [];
const actsOf = (lv, p) => bricksOf(lv, p).flatMap(b => (A.ACTS[b] || []).map(a => ({ ...a, brick: b, key: b + '.' + a.id })));
const ACTKEY = {}; Object.entries(A.ACTS).forEach(([b, list]) => list.forEach(a => { ACTKEY[b + '.' + a.id] = { ...a, brick: b, key: b + '.' + a.id }; }));
function totalScore() { return Object.values(state.results).reduce((s, r) => s + r.score, 0); }

function brickPct(acts, b) {
  const v = Object.entries(acts || {}).filter(([k]) => k.split('.')[0] === b).map(([, p]) => p);
  return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length) : undefined;
}

/* ---------- online sync (Google Sheets via Apps Script) ---------- */
let memQueue = {}, flushing = false, lastNetError = '';
function cloudUrl() { try { return (localStorage.getItem(CLOUD_KEY) || A.CLOUD_URL_DEFAULT || '').trim(); } catch (e) { return A.CLOUD_URL_DEFAULT || ''; } }
function loadQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '{}'); } catch (e) { return memQueue; } }
function saveQueue(q) { memQueue = q; try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
function enqueue(rec) { const q = loadQueue(); q[rec.id] = rec; saveQueue(q); }
function setSync(msg) { try { localStorage.setItem(SYNC_KEY, msg); } catch (e) {} }
function getSync() { try { return localStorage.getItem(SYNC_KEY) || ''; } catch (e) { return ''; } }
let jsonpN = 0;
function jsonp(url, params, timeout = 15000) {
  return new Promise((resolve, reject) => {
    const cb = '__sp_cb' + (++jsonpN) + '_' + Date.now(), s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout);
    function cleanup() { clearTimeout(t); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('blocked')); };
    s.src = url + (url.includes('?') ? '&' : '?') + Object.entries({ ...params, callback: cb }).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
    document.head.appendChild(s);
  });
}
function toRow(rec) { return A.sheetRow(rec); }
async function postRecords(url, records) {
  const payload = recs => ({ secret: A.CLOUD_SECRET, records: recs.map(r => ({ id: r.id, sheet: A.sheet, row: toRow(r) })) });
  const body = JSON.stringify(payload(records));
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' });
    const j = await r.json(); if (j.ok) return 'ok'; if (j.error === 'secret') return 'secret';
  } catch (e) { lastNetError = 'fetch: ' + e.message; }
  try {
    for (const rec of records) { const j = await jsonp(url, { p: JSON.stringify(payload([rec])) }); if (!j || !j.ok) return j && j.error === 'secret' ? 'secret' : 'error'; }
    return 'ok';
  } catch (e) { lastNetError += ' | jsonp: ' + e.message; }
  try { await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body }); return 'sent'; }
  catch (e) { lastNetError += ' | no-cors: ' + e.message; return 'offline'; }
}
async function flushQueue(manual) {
  const url = cloudUrl();
  if (!url) { if (manual) uiAlert(T.noUrl); renderCloudStatus(); return; }
  if (flushing) return;
  const q = loadQueue(), recs = Object.values(q);
  if (!recs.length) { if (manual) uiAlert(T.nothingQueued); renderCloudStatus(); return; }
  flushing = true; const res = await postRecords(url, recs); flushing = false;
  if (res === 'ok' || res === 'sent') {
    const now = loadQueue(); recs.forEach(r => { if (now[r.id] && JSON.stringify(now[r.id]) === JSON.stringify(r)) delete now[r.id]; }); saveQueue(now);
    setSync(new Date().toLocaleString(A.locale) + (res === 'sent' ? T.sentNoConfirm : ''));
  }
  if (manual) uiAlert(res === 'ok' ? T.sentOk(recs.length) : res === 'sent' ? T.sentUnsure : res === 'secret' ? T.badSecret : res === 'offline' ? (navigator.onLine === false ? T.offline : T.blocked + ' [' + lastNetError + ']') : T.sheetError);
  renderCloudStatus(res);
}
function renderCloudStatus() {
  const pending = Object.keys(loadQueue()).length, url = cloudUrl(), el = $('cloud-status');
  if (el) el.innerHTML = !url ? `<span style="color:var(--danger)">${T.notLinked}</span>`
    : `${pending ? `<span style="color:#b45309">${T.pending(pending)}</span>` : `<span style="color:var(--success)">${T.allSent}</span>`} <span style="color:var(--muted);font-weight:600">• ${T.lastSend}: ${getSync() || '—'}</span>`;
  const inp = $('cloud-url'); if (inp && !inp.value) inp.value = url;
  const rs = $('res-sync');
  if (rs && state.sessionId) { const mine = loadQueue()[state.sessionId]; rs.textContent = !url ? T.savedLocal : mine ? T.savedWillSend : T.sentToTeacher; }
}
function saveCloudUrl() {
  const v = $('cloud-url').value.trim();
  if (v && !/^https:\/\/script\.google(usercontent)?\.com\//.test(v)) return uiAlert(T.urlMustStart);
  try { localStorage.setItem(CLOUD_KEY, v); } catch (e) {}
  renderCloudStatus(); uiAlert(v ? T.urlSaved : T.urlDeleted); if (v) flushQueue();
}
async function testCloud() {
  const url = $('cloud-url').value.trim() || cloudUrl(); if (!url) return uiAlert(T.pasteFirst);
  let j = null, err = '';
  try { const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'secret=' + encodeURIComponent(A.CLOUD_SECRET)); j = await r.json(); }
  catch (e) { err = 'fetch: ' + e.message; try { j = await jsonp(url, { secret: A.CLOUD_SECRET }); } catch (e2) { err += ' | jsonp: ' + e2.message; } }
  if (j) uiAlert(j.secretOk ? T.linkOk : T.linkBadSecret); else uiAlert(T.linkFail + ' [' + err + ']');
}
function pushAllLocal() { const all = loadAll(); if (!all.length) return uiAlert(T.emptyLog); const q = loadQueue(); all.forEach(r => { q[r.id] = r; }); saveQueue(q); flushQueue(true); }
window.addEventListener('online', () => flushQueue());
setInterval(() => flushQueue(), 60000);
setTimeout(() => flushQueue(), 1500);

function saveSession() {
  if (!state.sessionId) return;
  const all = loadAll(), score = totalScore(), max = maxTotal();
  const doneMax = Object.values(state.results).reduce((s, r) => s + r.max, 0);
  const rec = {
    id: state.sessionId, name: state.student.name, group: state.student.group, level: state.level, path: state.path,
    date: state.startedAt, updated: new Date().toLocaleString(A.locale),
    score, max, grade20: max ? Math.round(score / max * 200) / 10 : 0, pct: doneMax ? Math.round(score / doneMax * 100) : 0,
    done: Object.keys(state.results).length, total: actsOf(state.level, state.path).length,
    acts: Object.fromEntries(Object.entries(state.results).map(([k, r]) => [k, Math.round(r.score / r.max * 100)]))
  };
  const i = all.findIndex(r => r.id === rec.id); if (i >= 0) all[i] = rec; else all.unshift(rec);
  saveAll(all); enqueue(rec); flushQueue();
}

          <input type="text" id="cloud-url" class="form-input" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" style="flex:1;min-width:220px;font-size:.8rem">
          <button class="btn btn-primary btn-sm" onclick="saveCloudUrl()">💾 ${T.saveLink}</button>
          <button class="btn btn-soft btn-sm" onclick="testCloud()">🔌 ${T.test}</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.8rem;font-weight:700">
          <span id="cloud-status"></span>
          <button class="btn btn-secondary btn-sm" onclick="flushQueue(true)">📤 ${T.sendNow}</button>
          <button class="btn btn-secondary btn-sm" onclick="pushAllLocal()">⬆️ ${T.sendAll}</button></div></div>
      <div style="margin-top:14px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px">
        <div style="font-weight:800;font-size:.9rem">${T.avgByAct} <span style="font-weight:600;color:var(--muted);font-size:.75rem">${T.avgNote}</span></div>
        <div class="bars" id="t-bars"></div></div>
      <div class="table-wrap"><table class="res"><thead id="t-head"></thead><tbody id="t-body"></tbody></table></div>
    </div></div></section>
</main>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header"><div><h4 style="font-weight:800">📖 ${T.summaries}</h4><span style="font-size:.72rem;color:var(--muted)">${T.drawerSub}</span></div>
    <button class="icon-btn" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-content"><div class="tabs" id="drawer-tabs"></div><div id="drawer-body"></div></div>
</aside>

<div id="ui-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:420px;width:100%;text-align:center"><p id="ui-msg" style="font-weight:700;margin:8px 0 14px"></p>
    <input id="ui-input" class="form-input" type="text" style="display:none;margin-bottom:14px">
    <div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" id="ui-ok">${T.ok}</button><button class="btn btn-secondary" id="ui-cancel">${T.cancel}</button></div></div>
</div>
<footer>${T.footer}<br><span class="credit">LHOUSSAINE BOURBI — S.S GUIGOU — BOULMANE 2026</span></footer>`;
  ['in-name', 'in-group'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } }));
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function showScreen(id) {
  sound.click();
  if (state.run && state.run.timer) { clearTimeout(state.run.timer); state.run.timer = null; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function brickNames(lv, p) { return bricksOf(lv, p).map(b => A.BRICKS[b].title).join(' ← '); }
function pickLevel(l) {
  sound.click(); state.level = l; $('login-err').style.display = 'none';
  document.querySelectorAll('.level-card[data-level]').forEach(c => c.classList.toggle('active', Number(c.dataset.level) === l));
  [1, 2, 3].forEach(p => { const h = $('ph-' + p); if (h) h.textContent = brickNames(l, p); });
}
function pickPath(p) { sound.click(); state.path = p; $('login-err').style.display = 'none'; document.querySelectorAll('.path-card').forEach(c => c.classList.toggle('active', Number(c.dataset.path) === p)); }
function pickGroup(el, g) { sound.click(); $('in-group').value = g; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === el)); }
function loginError(msg) { const e = $('login-err'); e.textContent = msg; e.style.display = 'block'; sound.ko(); }
function classLabel() { return `${T.levelWord} ${state.level} • ${T.pathWord} ${state.path} — ${state.student.group}`; }
function doLogin() {
  const name = $('in-name').value.trim(), group = $('in-group').value.trim();
  if (!name) return loginError(T.errName);
  if (!state.level) return loginError(T.errLevel);
  if (!state.path) return loginError(T.errPath);
  if (!group) return loginError(T.errGroup);
  $('login-err').style.display = 'none'; sound.ok();
  state.student = { name, group }; startSession();
}
function startSession() {
  state.sessionId = 'S' + Date.now() + '-' + state.level + state.path;
  state.startedAt = new Date().toLocaleString(A.locale); state.results = {};
  $('intro-name').textContent = state.student.name; $('intro-level').textContent = classLabel();
  $('intro-goals').innerHTML = bricksOf(state.level, state.path).map(b => `<div class="goal-block"><div class="goal-head">${A.BRICKS[b].icon} ${A.BRICKS[b].title}</div><ul class="rem-list">${A.BRICKS[b].goals.map(g => `<li>${g}</li>`).join('')}</ul></div>`).join('');
  showScreen('screen-intro');
}
function changePath() {
  uiPrompt(T.askPath, v => { const p = Number(String(v).trim()); if (![1, 2, 3].includes(p)) return uiAlert(T.errPath); if (Object.keys(state.results).length) saveSession(); state.path = p; startSession(); });
}
function showMenu() {
  $('menu-name').textContent = state.student.name; $('menu-class').textContent = classLabel(); $('menu-score').textContent = totalScore();
  $('btn-finish').style.display = Object.keys(state.results).length ? 'inline-flex' : 'none';
  let n = 0;
  $('games-grid').innerHTML = bricksOf(state.level, state.path).map(b => {
    const B = A.BRICKS[b];
    return `<div class="brick-sec"><div class="brick-head" style="border-color:${B.color}"><span class="gc-icon" style="background:${B.bg};color:${B.color}">${B.icon}</span><div><div style="font-weight:900">${B.title}</div><div style="font-size:.78rem;color:var(--muted)">${B.short}</div></div></div>
      <div class="games-grid">${A.ACTS[b].map(a => { const key = b + '.' + a.id, r = state.results[key]; n++;
        return `<div class="game-card ${r ? 'done' : ''}" onclick="openActivity('${key}')"><div><div class="gc-head"><div class="gc-icon" style="background:${B.bg};color:${B.color}">${a.icon}</div>
        <div><div class="gc-title">${n}. ${a.title}</div><span class="badge">${a.count} ${T.questions}</span></div></div><p class="gc-desc">${a.desc}</p></div>
        <div class="gc-foot"><span>${r ? `✅ ${r.score} / ${r.max}` : T.notDone}</span><span>${r ? T.redoArrow : T.startArrow}</span></div></div>`; }).join('')}</div></div>`;
  }).join('');
  showScreen('screen-menu');
}
function leaveDashboard() { $('t-login').style.display = 'block'; $('t-panel').style.display = 'none'; $('t-pwd').value = ''; if (state.sessionId) showMenu(); else showScreen('screen-welcome'); }

/* =====================================================================
   ACTIVITY ENGINE — two item kinds: 'mcq' and 'order'
   ===================================================================== */
function openActivity(key) {
  const a = ACTKEY[key], B = A.BRICKS[a.brick];
  state.lastAct = key;
  let items = [];
  try { items = a.build(state.level); } catch (e) { console.error(e); }
  if (!items.length) return uiAlert(T.noItems);
  state.run = { key, items, idx: 0, score: 0, max: items.length, correct: 0, locked: false, timer: null };
  $('rem-icon').innerHTML = a.icon; $('rem-icon').style.background = B.bg; $('rem-icon').style.color = B.color;
  $('rem-title').textContent = `${B.title} — ${a.title}`;
  $('rem-body').innerHTML = a.reminder(state.level);
  showScreen('screen-reminder');
}
function startRun() { const r = state.run; showScreen('screen-play'); if (r.resume && r.locked) { r.resume = false; return; } r.resume = false; renderItem(); }
function showReminderAgain() {
  const a = ACTKEY[state.run.key]; $('rem-body').innerHTML = a.reminder(state.level);
  if (state.run.timer) { clearTimeout(state.run.timer); state.run.timer = null; }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $('screen-reminder').classList.add('active'); state.run.resume = true;
}
function leaveRun() { uiConfirm(T.leaveAct, showMenu); }
function speakBtn(text) { return TTS.ready && text ? `<button class="btn btn-soft btn-sm speak" onclick="TTS.say(${esc(JSON.stringify(text))})">🔈 ${T.listen}</button>` : ''; }
function renderItem() {
  const r = state.run, a = ACTKEY[r.key], item = r.items[r.idx];
  r.locked = false;
  $('play-title').textContent = a.title; $('play-progress').textContent = `${r.idx + 1} / ${r.items.length}`;
  $('play-score').textContent = r.score; $('play-bar').style.width = (r.idx / r.items.length * 100) + '%';
  $('play-feedback').style.display = 'none'; $('btn-next').style.display = 'none';
  const area = $('play-area'); area.innerHTML = '';
  const finish = (ok, html) => {
    if (r.locked) return; r.locked = true;
    if (r.timer) { clearTimeout(r.timer); r.timer = null; }
    if (ok) { r.score++; r.correct++; }
    $('play-score').textContent = r.score;
    const fb = $('play-feedback'); fb.style.display = 'block'; fb.className = 'feedback ' + (ok ? 'ok' : 'ko');
    fb.innerHTML = (ok ? `<strong>👏 ${T.bravo} (+1)</strong>` : `<strong>${T.letsFix}</strong>`) + (html ? `<div style="margin-top:4px">${html}</div>` : '');
    ok ? sound.ok() : sound.ko();
    const nb = $('btn-next'); nb.style.display = 'inline-flex'; nb.textContent = r.idx + 1 < r.items.length ? T.next : T.endAct; setTimeout(() => nb.focus(), 50);
  };
  (item.kind === 'order' ? renderOrder : renderMcq)(item, area, finish);
}
function renderMcq(it, area, finish) {
  const dirAttr = it.dir ? ` dir="${it.dir}"` : '';
  let html = '';
  if (it.passage) html += `<div class="passage"${dirAttr}>${it.passageTitle ? `<div class="p-title">${it.passageTitle}</div>` : ''}${it.passage}</div>`;
  html += `<div class="q-box"${dirAttr}>${it.q}${speakBtn(it.speak)}</div>`;
  if (it.flash) html += `<div class="flash-box" id="flash-box"><div class="flash-word">${it.flash.html}</div><div class="timer"><div id="flash-bar"></div></div></div>`;
  html += `<div class="answers ${it.center ? 'center' : ''} ${it.big ? 'big' : ''}" id="ans" style="${it.flash ? 'visibility:hidden' : ''}">${it.options.map((o, i) => `<button class="ans-btn ${it.center ? 'center' : ''}" data-i="${i}"${dirAttr}>${o}</button>`).join('')}</div>`;
  area.innerHTML = html;
  const btns = [...area.querySelectorAll('.ans-btn')];
  btns.forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i), ok = i === it.answer;
    btns.forEach(x => x.disabled = true); b.classList.add(ok ? 'correct' : 'wrong'); btns[it.answer].classList.add('correct');
    finish(ok, it.explain || '');
  });
  if (it.flash) {
    const bar = $('flash-bar'); bar.style.transition = `width ${it.flash.ms}ms linear`; requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
    state.run.timer = setTimeout(() => { const fbx = $('flash-box'); if (fbx) fbx.innerHTML = `<div class="flash-hidden">${T.flashHidden}</div>`; const an = $('ans'); if (an) an.style.visibility = 'visible'; state.run.timer = null; }, it.flash.ms);
  }
}
function renderOrder(it, area, finish) {
  const dirAttr = it.dir ? ` dir="${it.dir}"` : '';
  area.innerHTML = `${it.passage ? `<div class="passage"${dirAttr}>${it.passage}</div>` : ''}<div class="q-box"${dirAttr}>${it.q}${speakBtn(it.speak)}</div>
    <div class="order-slot ${it.joiner === '' ? 'tight' : ''} ${it.vertical ? 'vertical' : ''}" id="slot"${dirAttr}><span class="slot-ph">${T.tapTiles}</span></div>
    <div class="order-pool ${it.vertical ? 'vertical' : ''}" id="pool"${dirAttr}></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="btn btn-secondary btn-sm" id="o-reset">↺ ${T.reset}</button><button class="btn btn-primary" id="o-check">${T.check}</button></div>`;
  const pool = $('pool'), slot = $('slot'), placed = [];
  const tiles = shuffle(it.tiles.map((t, i) => ({ t, i })));
  const draw = () => {
    pool.innerHTML = ''; tiles.forEach(o => { if (placed.includes(o)) return; const b = document.createElement('button'); b.className = 'tile'; b.innerHTML = o.t; b.onclick = () => { sound.click(); placed.push(o); draw(); }; pool.appendChild(b); });
    slot.innerHTML = placed.length ? '' : `<span class="slot-ph">${T.tapTiles}</span>`;
    placed.forEach((o, k) => { const b = document.createElement('button'); b.className = 'tile placed'; b.innerHTML = o.t; b.onclick = () => { placed.splice(k, 1); draw(); }; slot.appendChild(b); });
  };
  draw();
  $('o-reset').onclick = () => { placed.length = 0; draw(); };
  $('o-check').onclick = () => {
    if (placed.length < it.tiles.length) return uiAlert(T.useAllTiles);
    const got = placed.map(o => o.t).join('\u0001'), want = it.answer.join('\u0001');
    area.querySelectorAll('button').forEach(b => b.disabled = true);
    const ok = got === want; slot.classList.add(ok ? 'ok' : 'ko');
    finish(ok, (ok ? '' : `${T.rightOrder}: <div class="right-order"${dirAttr}>${it.answer.join(it.vertical ? '<br>' : (it.joiner === '' ? '' : ' '))}</div>`) + (it.explain || ''));
  };
}
function nextItem() { const r = state.run; sound.click(); r.idx++; if (r.idx < r.items.length) renderItem(); else completeActivity(); }
function completeActivity() {
  const r = state.run, a = ACTKEY[r.key], prev = state.results[r.key];
  if (!prev || r.score >= prev.score) state.results[r.key] = { score: r.score, max: r.max, correct: r.correct };
  saveSession();
  const pct = Math.round(r.score / r.max * 100);
  $('ad-stars').textContent = pct >= 80 ? '⭐⭐⭐' : pct >= 50 ? '⭐⭐☆' : '⭐☆☆';
  $('ad-title').textContent = a.title; $('ad-msg').textContent = pct >= 80 ? T.msgHi : pct >= 50 ? T.msgMid : T.msgLo;
  $('ad-score').textContent = `${r.score} / ${r.max}`; $('ad-correct').textContent = `${r.correct} / ${r.items.length}`; $('ad-pct').textContent = pct + '%';
  state.run = null; showScreen('screen-actdone'); sound.fanfare();
}

/* =====================================================================
   RESULTS
   ===================================================================== */
const pctCell = v => v === undefined ? '<span class="pct na">—</span>' : `<span class="pct ${v >= 80 ? 'hi' : v >= 50 ? 'mid' : 'lo'}">${v}%</span>`;
function finishAll() {
  saveSession();
  const score = totalScore(), acts = actsOf(state.level, state.path), done = Object.keys(state.results).length;
  const doneMax = Object.values(state.results).reduce((s, r) => s + r.max, 0), pct = doneMax ? Math.round(score / doneMax * 100) : 0;
  $('res-name').textContent = state.student.name; $('res-class').textContent = classLabel();
  $('res-done').textContent = `${done} / ${acts.length}`; $('res-score').textContent = `${score} / ${maxTotal()}`; $('res-pct').textContent = pct + '%';
  $('res-msg').textContent = pct >= 85 ? T.certHi : pct >= 60 ? T.certMid : T.certLo;
  $('res-table').innerHTML = `<tr><th>${T.activity}</th><th>${T.pointsCap}</th><th>${T.rate}</th></tr>` + acts.map(a => {
    const r = state.results[a.key], label = `${A.BRICKS[a.brick].icon} ${A.BRICKS[a.brick].title} — ${a.title}`;
    if (!r) return `<tr><td>${label}</td><td>—</td><td><span class="pct na">${T.notDone}</span></td></tr>`;
    const p = Math.round(r.score / r.max * 100); return `<tr><td>${label}</td><td>${r.score} / ${r.max}</td><td>${pctCell(p)}</td></tr>`;
  }).join('');
  showScreen('screen-results'); renderCloudStatus(); setTimeout(renderCloudStatus, 4000); sound.fanfare();
}
function restartApp() {
  state.student = { name: '', group: '' }; state.level = null; state.path = null; state.sessionId = null; state.results = {}; state.run = null;
  $('in-name').value = ''; $('in-group').value = ''; $('login-err').style.display = 'none';
  document.querySelectorAll('.level-card, .chip').forEach(c => c.classList.remove('active')); [1, 2, 3].forEach(p => { $('ph-' + p).textContent = ''; });
  showScreen('screen-welcome');
}

/* =====================================================================
   TEACHER SPACE
   ===================================================================== */
function authTeacher() { if ($('t-pwd').value.trim() === getPwd()) { sound.ok(); $('t-login').style.display = 'none'; $('t-panel').style.display = 'block'; renderTeacher(); renderCloudStatus(); } else { sound.ko(); uiAlert(T.wrongPwd); } }
function recoverPwd() { uiPrompt(T.recoverAsk, v => { if (v.trim().toUpperCase() !== A.RECOVERY_CODE) { sound.ko(); return uiAlert(T.recoverBad); } try { localStorage.removeItem(PWD_KEY); } catch (e) {} sound.ok(); uiAlert(T.recoverOk(A.DEFAULT_PWD)); }); }
function changePwd() { uiPrompt(T.newPwdAsk, p => { if (p.trim().length < 6) return uiAlert(T.pwdShort); try { localStorage.setItem(PWD_KEY, p.trim()); uiAlert(T.pwdChanged); } catch (e) { uiAlert(T.pwdSaveFail); } }); }
function filtered() {
  const q = $('t-search').value.trim().toLowerCase(), lv = $('t-level').value, pa = $('t-path').value;
  return loadAll().filter(r => (!lv || String(r.level) === lv) && (!pa || String(r.path) === pa) && (!q || r.name.toLowerCase().includes(q) || String(r.group).toLowerCase().includes(q)));
}
const BRICK_IDS = Object.keys(A.BRICKS);
function renderTeacher() {
  const rows = filtered();
  $('t-head').innerHTML = `<tr><th>#</th><th>${T.colName}</th><th>${T.colLevel}</th><th>${T.colPath}</th><th>${T.colGroup}</th><th>${T.colDate}</th>${BRICK_IDS.map(b => `<th title="${A.BRICKS[b].title}">${A.BRICKS[b].icon} ${A.BRICKS[b].title}</th>`).join('')}<th>${T.balance}</th><th>/20</th><th>${T.rate}</th></tr>`;
  $('t-body').innerHTML = rows.length ? rows.map((r, i) => `<tr><td>${i + 1}</td><td><strong>${esc(r.name)}</strong></td><td>${r.level}</td><td>${r.path}</td><td><span class="badge">${esc(r.group)}</span></td><td style="color:var(--muted);font-size:.72rem">${esc(r.updated || r.date)}</td>
    ${BRICK_IDS.map(b => `<td>${pctCell(brickPct(r.acts, b))}</td>`).join('')}<td><strong>${r.score}</strong></td><td><strong style="color:#3730a3">${r.grade20}</strong></td><td>${pctCell(r.pct)}</td></tr>`).join('')
    : `<tr><td colspan="${9 + BRICK_IDS.length}" style="text-align:center;color:var(--muted);padding:18px">${T.noResults}</td></tr>`;
  const keys = Object.keys(ACTKEY);
  $('t-bars').innerHTML = keys.map(k => {
    const vals = rows.map(r => r.acts && r.acts[k]).filter(v => v !== undefined); if (!vals.length) return '';
    const avg = Math.round(vals.reduce((s, v) => s + v, 0) / vals.length), col = avg >= 80 ? '#16a34a' : avg >= 50 ? '#eab308' : '#dc2626', a = ACTKEY[k];
    return `<div class="bar-row"><span>${A.BRICKS[a.brick].icon} ${a.title}</span><div class="bar-track"><div class="bar-fill" style="width:${avg}%;background:${col}"></div></div><span>${avg}%</span></div>`;
  }).join('') + `<div style="font-size:.75rem;color:var(--muted);margin-top:4px">${T.shownAttempts}: ${rows.length}</div>`;
}
function exportCSV() {
  const rows = filtered(); if (!rows.length) return uiAlert(T.nothingExport);
  const q = s => `"${String(s).replace(/"/g, '""')}"`, objs = rows.map(toRow), head = Object.keys(objs[0]);
  const csv = '﻿' + [head.map(q).join(','), ...objs.map(o => head.map(h => q(o[h] === undefined ? '' : o[h])).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a'); a.href = url; a.download = `${T.csvName}_${new Date().toISOString().slice(0, 10)}.csv`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function clearResults() { uiConfirm(T.clearAsk, () => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} renderTeacher(); }); }

/* =====================================================================
   LESSON SUMMARIES (drawer)
   ===================================================================== */
function openDrawer() { sound.click(); renderDrawer(); $('drawer-overlay').style.display = 'block'; $('drawer').classList.add('open'); }
function closeDrawer() { $('drawer-overlay').style.display = 'none'; $('drawer').classList.remove('open'); }
function renderDrawer(b) {

    <h4>🎮 ${T.brickActs}</h4><ul>${A.ACTS[b].map(a => `<li><strong>${a.title}:</strong> ${a.desc}</li>`).join('')}</ul>
    <p style="font-size:.8rem;color:var(--muted);margin-top:16px">${T.byLine} — <span class="ltr">LHOUSSAINE BOURBI — S.S GUIGOU — BOULMANE 2026</span></p>`;
}
